<script>
(()=>{var s=document.getElementById('splash');if(!s)return;
 // автоматические тесты (webdriver) заставку не ждут

 s.addEventListener('click',function(e){if(!e.target.closest('a'))gone()});
 // отсчёт — после загрузки страницы (файл тяжёлый): заставка видна около 3 секунд от начала загрузки, но не меньше 0,8 с
 var go=function(){var d=Math.max(800,3000-performance.now()),b=s.querySelector('.sp-bar i');
  if(b){b.style.animationDuration=d+'ms';b.style.animationPlayState='running'}setTimeout(gone,d)};
 if(document.readyState==='complete')go();else window.addEventListener('load',go)})();
</script>
